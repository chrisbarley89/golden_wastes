{{- if .Site.Params.enablePagefindCSS }}
  <link rel="stylesheet" href="/_pagefind/pagefind-ui.css" />
{{- end }}

{{- if and (or .IsHome (eq .Params.homeMode "rules")) (.Site.Params.interactiveMap.enabled | default false) }}
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
{{- end }}

{{- $styles := resources.Get "scss/main.scss" | toCSS }}
<link rel="stylesheet" href="{{ $styles.RelPermalink }}" />
