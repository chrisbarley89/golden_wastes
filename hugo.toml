baseURL = "https://goldenwastes.wiki/"
languageCode = "en-US"
title = "Golden Wastes"

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
unsafe = true

[module]
[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/layouts"
target = "layouts"

[[module.mounts]]
source = "themes/cleanwiki/assets"
target = "assets"

[[module.mounts]]
source = "themes/cleanwiki/static"
target = "static"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

[module.hugoVersion]
extended = false
min = "0.146.0"

[params]
enablePagefindCSS = false
subtitle = "A Brutal TTRPG Adventure"

[params.pagefind]
  initialPageSize = 5
  loadMoreCount = 5
  showSubResults = true
  showImages = true
  fitThumbnails = false
  debounceTimeoutMs = 300
  excerptLength = 30

  [params.pagefind.thumbnailSources]
    primary = "image"
    fallback1 = "thumbnail"
    fallback2 = "featured"

  placeholderImage = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 0x400'%3E%3Crect fill='%23e5e7eb' width='400' height='400'/%3E%3Ctext x='50%25' y='50%25' font-size='24' fill='%23999' text-anchor='middle' dy='.3em'%3ENo Image%3C/text%3E%3C/svg%3E"

[params.infoboxBadges]
  showOnThumbnails = true

# SVG pools used when a page has no thumbnail image. Category names are
# matched case-insensitively; `other` is used when no category is detected.
[params.thumbnailFallbacks]
campaign = ["/SVG/sun.svg"]
class = ["/SVG/sword-in-stone.svg", "/SVG/character.svg"]
item = ["/SVG/backpack.svg"]
location = ["/SVG/village.svg"]
lore = ["/SVG/book-cover.svg"]
monster = ["/SVG/bestial-fangs.svg", "/SVG/animal-skull.svg"]
other = ["/SVG/character.svg"]

[params.pageLayout]
showHeader = true
showMeta = true
showTaxonomies = true
showFeaturedImage = true
showSeries = true
showUpdated = true
showReferences = true
referencesInSeeAlso = true
showTaxonomyIcons = true
showReadingTime = false
metaBelowContent = false
taxonomiesBelowContent = false

[params.wiki]
show_date = false

[params.breadcrumbs]
enabled = true
separator = "/"
show_taxonomies = true
taxonomy_blacklist = ["campaign"]

[params.navbarBar]
iconsHaveLabels = false
iconSeparator = true

[params.pagesCMS]
baseURL = "https://app.pagescms.org"
owner = "jack-hk"
repo = "golden_wastes"
branch = "production"

[params.smallTiles]
type = "categories"

[params.bigTiles]
truncate = 130

# Ordered featured pages for each front page. Set count = 0 to hide Featured.
[params.homeViews.lore]
count = 3
pages = ["/campaign/the-project", "/campaign/how-to-play", "/location/the-wastes"]

[params.homeViews.rules]
count = 3
pages = ["/campaign/how-to-play", "/class/fighter", "/item/shield"]

[params.smallTiles.images]
monster = "/uploads/monster.jpg"
lore = "/uploads/blue-abstract.jpg"
class = "/uploads/white-abstract.jpg"
item = "/uploads/white-abstract.jpg"
campaign = "/uploads/red-abstract.jpg"
location = "/uploads/cave.jpg"

[params.bigTiles.partials]
lore = "big-tile-lore.html"
location = "big-tile-lore.html"
campaign = "big-tile-campaign.html"
quote = "big-tile-quote.html"

[params.timeline]
enabled = true
title = "Timeline"
minimumItems = 2
placement = "alternate"
itemMinWidth = "120px"
alternateCardWidth = "180px"
thumbnailPosition = "above"
itemGap = "0.3rem"
trackMinHeight = "290px"
bottomMargin = "1rem"

[params.timeline.mobile]
layout = "vertical"
side = "left"
bottomMargin = "0"
itemMinWidth = "180px"
itemGap = "1rem"
trackMinHeight = "340px"

[params.timeline.scrollbar]
styled = true
showButtons = true
showRightHint = true

[params.timeline.increments]
enabled = true

[[params.timeline.increments.items]]
after = 1
label = "1000 years ago"
placement = "bottom"

[[params.timeline.increments.items]]
after = 3
label = "300 years ago"
placement = "bottom"

[[params.timeline.increments.items]]
after = 4
label = "Present"
placement = "top"

[params.timeline.thumbnails]
enabled = true
usePageImage = false
enabledOnMobile = true
size = "96px"
minSize = "64px"
maxSize = "132px"
sideMinSize = "52px"
sideMaxSize = "88px"
mobileSize = "96px"
mobileMinSize = "64px"
mobileMaxSize = "128px"
height = "auto"
objectFit = "cover"
objectPosition = "center"
borderRadius = "4px"

[[params.timeline.entries]]
pageRef = "/lore/great-pulse"
anchor = "the-first-great-pulse"
title = "First Great Pulse"
description = "An apocalyptic event where Zohm was unleashed in great capacity."

[[params.timeline.entries]]
pageRef = "/lore/memory-plague"
title = "Memory Plague"
description = "After Zohm receded, the Memory Plague washed generations of knowledge away."

[[params.timeline.entries]]
pageRef = "/lore/great-pulse"
anchor = "the-tablet-rediscovered"
title = "Tablet Rediscovered"
description = "A tablet is discovered with a stern warning of a second Great Pulse."

[[params.timeline.entries]]
pageRef = "/lore/great-pulse"
anchor = "the-second-great-pulse"
title = "Second Great Pulse"
description = "The second Great Pulse returns ruining the known world."

[[params.timeline.entries]]
pageRef = "/location/the-wastes"
title = "The Wastes"
description = "The wastleland, an aftermath of the Second Great Pulse."

[params.interactiveMap]
enabled = true
title = "Interactive Map"
description = "Explore the interactive map of [The Wastes](/location/the-wastes/)."
image = "/uploads/the-wastes-map.jpg"
imageAlt = "An illustrated map of the Wastes"
imageWidth = 1593
imageHeight = 1195
height = "82vh"
minZoom = -2
maxZoom = 2
initialZoom = -1
zoomControl = true
scrollWheelZoom = false
dragging = true
attribution = ""
ariaLabel = "Interactive map of the Wastes"
markerEnlargeSize = 1.25
markerTransitionTime = "200ms"
popupMaxWidthMobile = 300
popupMaxWidthTablet = 300

[params.homeMapNotification]
enabled = true
allowedViews = ["desktop"]
title = "Explore the Interactive Map"
description = "See our map down below!"

[params.interactiveMap.mobile]
show = true
height = "76svh"
clickToActivate = true
gateOnTablet = true
activateLabel = "Click to see map"
hideLabel = "Hide map"

